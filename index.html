<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Dragon Boat</title>
</head>
<body>

<h1>Team 1</h1>

<button onclick="send(1)">1</button>
<button onclick="send(2)">2</button>
<button onclick="send(3)">3</button>
<button onclick="send(4)">4</button>

<br><br>

<button onclick="send(5)">5</button>
<button onclick="send(6)">6</button>
<button onclick="send(7)">7</button>
<button onclick="send(8)">8</button>

<script>

const DATABASE =
"https://river-boat-default-rtdb.asia-southeast1.firebasedatabase.app";

const TEAM = 1;

async function send(button)
{
    // 1. 先讀 currentIndex
    let res = await fetch(DATABASE + "/meta/currentIndex.json");
    let index = await res.json();

    if (index === null) index = 0;

    // 2. 寫入事件
    await fetch(DATABASE + "/events/" + index + ".json",
    {
        method: "PUT",
        headers:
        {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(
        {
            team: TEAM,
            button: button,
            timestamp: Date.now()
        })
    });

    // 3. 更新 index
    await fetch(DATABASE + "/meta/currentIndex.json",
    {
        method: "PUT",
        headers:
        {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(index + 1)
    });

    console.log("sent", button);
}
</script>

</body>
</html>
